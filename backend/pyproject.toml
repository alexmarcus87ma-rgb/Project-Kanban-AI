[project]
name = "pm-backend"
version = "0.1.0"
description = "Project Management Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy==2.0.25",
    "python-dotenv==1.0.0",
    "pydantic==2.6.0",
    "pydantic-settings==2.1.0",
    "httpx==0.26.0",
    "bcrypt==4.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.2",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "ruff==0.1.13",
]

[tool.uv]
dev-dependencies = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.2",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "ruff==0.1.13",
]
